<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account — Live Quiz</title>
  <link rel="stylesheet" href="create-account.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="panel">
      <h2>Create New Account</h2>
      <input id="fullname" placeholder="Full name" />
      <input id="newUsername" placeholder="Choose username" />
      <input id="newPassword" type="password" placeholder="Choose password" />
      <div class="row">
        <button id="createBtn">Create Account</button>
        <a class="link" href="index.html">Back to Login</a>
      </div>
      <p class="note">Tip: Remember your username & password. This app stores data locally only.</p>
    </div>
  </div>

  <script src="create-account.js"></script>
</body>
</html>
