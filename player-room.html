<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Player Room — Live Quiz</title>
  <link rel="stylesheet" href="player-room.css"/>
</head>
<body>
  <div class="bg"></div>
  <div class="box">
    <h2>Player Room</h2>
    <p>Enter the PIN provided by the host to join a live quiz.</p>

    <input id="pinInput" placeholder="Enter 6-digit PIN" maxlength="6" />
    <input id="playerName" placeholder="Your name (optional)" />
    <div class="row">
      <button id="joinBtn">Start</button>
      <a href="dashboard.html" class="back">← Dashboard</a>
    </div>
  </div>

  <script src="player-room.js"></script>
</body>
</html>
